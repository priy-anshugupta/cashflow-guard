name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: code/requirements.txt
      - run: python -m pip install -r code/requirements.txt
      - run: python -m compileall -q code examples
      - run: python -m pytest
      - run: python examples/safe_spending.py
